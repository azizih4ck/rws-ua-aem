name: Mirror AEM to RWS + Trigger Azure DevOps

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  mirror-and-trigger:
    name: Mirror AEM Repo to RWS and Trigger Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Deloitte AEM repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-sync-bot"
          git config user.email "github-sync-bot@users.noreply.github.com"

      - name: Configure RWS remote
        env:
          RWS_GITHUB_USERNAME: ${{ secrets.RWS_GITHUB_USERNAME }}
          RWS_GITHUB_TOKEN: ${{ secrets.RWS_GITHUB_TOKEN }}
        run: |
          git remote remove rws 2>/dev/null || true
          git remote add rws \
            "https://${RWS_GITHUB_USERNAME}:${RWS_GITHUB_TOKEN}@github.com/azizih4ck/rws-ua-aem.git"

      - name: Mirror branch and tags
        run: |
          git push rws main --force-with-lease
          git push rws --tags

      - name: Verify commit SHA match
        env:
          RWS_GITHUB_USERNAME: ${{ secrets.RWS_GITHUB_USERNAME }}
          RWS_GITHUB_TOKEN: ${{ secrets.RWS_GITHUB_TOKEN }}
        run: |
          set -e
          SOURCE_SHA=$(git rev-parse HEAD)
          RWS_SHA=$(git ls-remote "https://${RWS_GITHUB_USERNAME}:${RWS_GITHUB_TOKEN}@github.com/azizih4ck/rws-ua-aem.git" refs/heads/main | cut -f1)

          echo "Source SHA: $SOURCE_SHA"
          echo "RWS SHA:    $RWS_SHA"

          if [ "$SOURCE_SHA" != "$RWS_SHA" ]; then
            echo "::error::SHA mismatch — AEM mirror failed verification"
            exit 1
          fi
          echo "Verified: RWS AEM main matches Deloitte main"

      - name: Trigger Azure DevOps AEM pipeline
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORG: ${{ secrets.AZURE_DEVOPS_ORG }}
          AZURE_DEVOPS_PROJECT: ${{ secrets.AZURE_DEVOPS_PROJECT }}
          AZURE_PIPELINE_ID: ${{ vars.AZURE_PIPELINE_ID_AEM }}
        run: |
          curl -f -X POST \
            -u ":${AZURE_DEVOPS_PAT}" \
            -H "Content-Type: application/json" \
            "https://dev.azure.com/${AZURE_DEVOPS_ORG}/${AZURE_DEVOPS_PROJECT}/_apis/pipelines/${AZURE_PIPELINE_ID}/runs?api-version=7.1" \
            -d '{"resources": {"repositories": {"self": {"refName": "refs/heads/main"}}}}'

      - name: Notify success
        if: success()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ AEM mirror + Azure DevOps trigger succeeded for commit ${{ github.sha }}.\"}" \
            "${TEAMS_WEBHOOK_URL}"

      - name: Notify failure
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ AEM mirror or Azure DevOps trigger FAILED for commit ${{ github.sha }}. Check workflow run.\"}" \
            "${TEAMS_WEBHOOK_URL}"
